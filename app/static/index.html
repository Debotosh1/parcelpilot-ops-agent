<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ParcelPilot Internal Ops Copilot</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c2430; --line: #2a3441;
    --text: #e6edf3; --muted: #93a1b1; --accent: #4c8dff; --accent-soft: #17304f;
    --critical: #ff5c5c; --high: #ff9f43; --medium: #ffd166; --info: #6ee7b7; --ok: #3fb950;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; }
  header {
    display:flex; align-items:center; gap:16px; padding:10px 18px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap;
  }
  header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:.2px; }
  header .tag { font-size:11px; color:var(--muted); border:1px solid var(--line); padding:2px 7px; border-radius:99px; }
  header .spacer { flex:1; }
  select, button, input { font-family:inherit; font-size:13px; }
  select, input[type=text] {
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:6px 9px;
  }
  button {
    background:var(--accent); color:#fff; border:0; border-radius:7px; padding:7px 13px;
    cursor:pointer; font-weight:600;
  }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  main { display:grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); height:calc(100vh - 53px); }
  @media (max-width: 980px) { main { grid-template-columns:1fr; height:auto; } }
  .col { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:92%; padding:11px 14px; border-radius:12px; line-height:1.55; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--accent-soft); border:1px solid #23486f; }
  .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .msg.sys { align-self:center; color:var(--muted); font-size:12px; background:transparent; border:1px dashed var(--line); }
  .trace { margin-top:10px; border-top:1px dashed var(--line); padding-top:9px; font-size:12px; color:var(--muted); }
  .trace .step { display:flex; gap:8px; align-items:flex-start; padding:3px 0; }
  .pill {
    font-family:var(--mono); font-size:10.5px; padding:1px 6px; border-radius:5px;
    border:1px solid var(--line); white-space:nowrap;
  }
  .pill.documents { color:#8ab4ff; border-color:#2b4a7d; }
  .pill.structured { color:#7ee0c0; border-color:#22624f; }
  .pill.calculation { color:#ffd166; border-color:#6b5620; }
  .pill.trust { color:#d8b4fe; border-color:#553a73; }
  .pill.monitoring { color:#8fd3ff; border-color:#245670; }
  .pill.action { color:#ff9f43; border-color:#7a4a1b; }
  .pill.denied { color:var(--critical); border-color:#6d2626; }
  .cites { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .cite { font-size:11px; border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--muted); }
  .cite.t1 { border-color:#3d6b45; color:#8fdc9e; }
  .cite.t2 { border-color:#2b4a7d; color:#8ab4ff; }
  .cite.t3 { border-color:#5a4a2a; color:#e2c891; }
  .cite.warn { border-color:#6d2626; color:#ff8c8c; }
  .confirm-card {
    margin-top:12px; border:1px solid var(--high); border-radius:10px; padding:12px; background:#241a10;
  }
  .confirm-card h4 { margin:0 0 8px; font-size:13px; color:var(--high); }
  .confirm-card table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .confirm-card td { padding:3px 6px; vertical-align:top; border-bottom:1px solid #3a2c1c; }
  .confirm-card td.k { color:var(--muted); width:38%; }
  .confirm-actions { display:flex; gap:8px; margin-top:10px; }
  .blocked { color:var(--critical); font-size:12px; margin-top:8px; }
  form#composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  form#composer input { flex:1; }
  .examples { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 12px; }
  .examples button { background:var(--panel-2); border:1px solid var(--line); color:var(--muted); font-size:11.5px; font-weight:500; padding:5px 9px; }
  .tabs { display:flex; gap:4px; padding:10px 14px 0; border-bottom:1px solid var(--line); background:var(--panel); }
  .tabs button { background:transparent; color:var(--muted); border:0; border-bottom:2px solid transparent; border-radius:0; padding:8px 12px; }
  .tabs button.active { color:var(--text); border-bottom-color:var(--accent); }
  .tabpanel { display:none; overflow-y:auto; padding:14px; flex:1; min-height:0; }
  .tabpanel.active { display:block; }
  .signal { border:1px solid var(--line); border-left-width:3px; border-radius:9px; padding:11px 12px; margin-bottom:10px; background:var(--panel); }
  .signal.critical { border-left-color:var(--critical); }
  .signal.high { border-left-color:var(--high); }
  .signal.medium { border-left-color:var(--medium); }
  .signal.info { border-left-color:var(--info); }
  .signal h4 { margin:0 0 5px; font-size:13px; }
  .signal p { margin:0 0 6px; color:var(--muted); font-size:12.5px; line-height:1.5; }
  .signal .rec { color:var(--text); font-size:12.5px; }
  .signal .meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .counts { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .count { border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:12px; background:var(--panel); }
  .count b { font-size:16px; display:block; }
  table.audit { width:100%; border-collapse:collapse; font-size:12px; font-family:var(--mono); }
  table.audit th, table.audit td { text-align:left; padding:5px 7px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.audit td.deny { color:var(--critical); }
  .muted { color:var(--muted); }
  .warnbar { background:#3a2416; color:#ffc98a; padding:7px 18px; font-size:12.5px; border-bottom:1px solid var(--line); }
  details.raw { margin-top:6px; }
  details.raw pre { background:#0b0f14; border:1px solid var(--line); border-radius:7px; padding:9px; overflow:auto; max-height:260px; font-size:11px; }
  .spinner { display:inline-block; width:11px; height:11px; border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>ParcelPilot · Internal Ops Copilot</h1>
  <span class="tag" id="snapshotTag">snapshot …</span>
  <span class="tag" id="modelTag">model …</span>
  <div class="spacer"></div>
  <label class="muted" for="userSel">Signed in as</label>
  <select id="userSel"></select>
  <span class="tag" id="scopeTag"></span>
  <button class="ghost" id="resetBtn">New session</button>
</header>
<div class="warnbar" id="warnbar" style="display:none"></div>

<main>
  <section class="col">
    <div id="chat"></div>
    <div class="examples" id="examples"></div>
    <form id="composer">
      <input type="text" id="input" autocomplete="off" placeholder="Ask about an order, ticket, policy or account…" />
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <section class="col" style="border-right:0">
    <div class="tabs">
      <button data-tab="signals" class="active">Ops signals</button>
      <button data-tab="audit">Audit log</button>
      <button data-tab="sources">Sources &amp; access</button>
    </div>
    <div class="tabpanel active" id="tab-signals"></div>
    <div class="tabpanel" id="tab-audit"></div>
    <div class="tabpanel" id="tab-sources"></div>
  </section>
</main>

<script>
const state = { user: null, session: "sess-" + Math.random().toString(36).slice(2, 8), boot: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const EXAMPLES = [
  "Can Northstar cancel ORD-1001 without a cancellation fee? Explain why.",
  "A pickup is three hours late because of carrier fault. Should I get a service credit?",
  "Is ORD-2002 owed a service credit, and how much?",
  "Which open tickets have breached their first-response target?",
  "TKT-450 said a 250 fee applied. Is that still right?",
  "What should I do about TKT-505?",
  "Show me what needs attention right now.",
];

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.detail?.message || body?.message || `HTTP ${res.status}`);
  return body;
}

function addMsg(kind, html) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  div.innerHTML = html;
  $("#chat").appendChild(div);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return div;
}

function renderTrace(steps) {
  if (!steps?.length) return "";
  const rows = steps.map((s) => `
    <div class="step">
      <span class="pill ${s.denied ? "denied" : s.family}">${esc(s.denied ? "denied" : s.family)}</span>
      <span><b>${esc(s.tool)}</b>(${esc(JSON.stringify(s.arguments).slice(1, -1) || "")}) → ${esc(s.summary)}</span>
    </div>`).join("");
  return `<div class="trace"><b>Tool trace</b>${rows}
    <details class="raw"><summary class="muted">raw tool results</summary><pre>${esc(JSON.stringify(steps.map(s => ({tool: s.tool, result: s.result})), null, 2))}</pre></details>
  </div>`;
}

function renderCitations(cites) {
  if (!cites?.length) return "";
  const chips = cites.map((c) => {
    const cls = c.warning ? "warn" : `t${c.authority_tier || 3}`;
    const label = `${c.doc_id}${c.clause ? " §" + c.clause : ""}${c.warning ? " ⚠ deprecated" : ""}`;
    return `<span class="cite ${cls}" title="${esc(c.warning || c.title || "")}">${esc(label)}</span>`;
  }).join("");
  return `<div class="cites"><span class="muted" style="font-size:11px">sources:</span>${chips}</div>`;
}

function renderConfirm(pending) {
  if (!pending) return "";
  const p = pending.preview || {};
  const rows = Object.entries(p).filter(([, v]) => v !== null && v !== undefined && v !== "")
    .map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("");
  return `
    <div class="confirm-card" data-action="${esc(pending.action_id)}">
      <h4>⏸ Confirmation required — nothing has been created yet</h4>
      <table>${rows}</table>
      ${pending.blocked_reason ? `<div class="blocked">⛔ ${esc(pending.blocked_reason)}</div>` : ""}
      <div class="confirm-actions">
        <button onclick="decide('${esc(pending.action_id)}','confirm',this)">Confirm &amp; execute</button>
        <button class="ghost" onclick="decide('${esc(pending.action_id)}','cancel',this)">Cancel</button>
      </div>
    </div>`;
}

async function decide(actionId, decision, btn) {
  const card = btn.closest(".confirm-card");
  card.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const out = await api(`/api/actions/${actionId}/confirm`, {
      method: "POST",
      body: JSON.stringify({ user_id: state.user, session_id: state.session, decision }),
    });
    card.querySelector(".confirm-actions").innerHTML =
      out.status === "executed"
        ? `<span style="color:var(--ok)">✔ Executed — ${esc(JSON.stringify(out.result).slice(0, 220))}</span>`
        : `<span class="muted">✖ Cancelled — nothing was changed.</span>`;
  } catch (e) {
    card.querySelector(".confirm-actions").innerHTML = `<span style="color:var(--critical)">⛔ ${esc(e.message)}</span>`;
  }
  loadAudit();
  loadSignals();
}

async function send(text) {
  addMsg("user", esc(text));
  const thinking = addMsg("bot", `<span class="spinner"></span> <span class="muted">working…</span>`);
  try {
    const out = await api("/api/chat", {
      method: "POST",
      body: JSON.stringify({ message: text, user_id: state.user, session_id: state.session }),
    });
    thinking.innerHTML =
      esc(out.answer) + renderCitations(out.citations) + renderConfirm(out.pending_action) + renderTrace(out.steps);
  } catch (e) {
    thinking.innerHTML = `<span style="color:var(--critical)">Error: ${esc(e.message)}</span>`;
  }
  $("#chat").scrollTop = $("#chat").scrollHeight;
  loadAudit();
}

async function loadSignals() {
  const panel = $("#tab-signals");
  try {
    const out = await api(`/api/signals?user_id=${encodeURIComponent(state.user)}`);
    const counts = out.counts || {};
    const head = `<div class="counts">
      ${["critical", "high", "medium", "info"].map((s) => `<div class="count"><b>${counts[s] || 0}</b>${s}</div>`).join("")}
      <div class="count"><b>${out.signals.length}</b>total</div>
      <div class="count" style="min-width:150px"><b style="font-size:12px">${esc(out.generated_at)}</b>snapshot · scope ${esc(out.scope.join(", "))}</div>
    </div>`;
    panel.innerHTML = head + (out.signals.map((s) => `
      <div class="signal ${esc(s.severity)}">
        <h4>${esc(s.title)}</h4>
        <p>${esc(s.detail)}</p>
        <div class="rec">→ ${esc(s.recommended_action)}</div>
        <div class="meta">
          <span class="pill">${esc(s.type)}</span>
          ${s.accounts.map((a) => `<span class="pill">${esc(a)}</span>`).join("")}
          <span class="pill">confidence: ${esc(s.confidence)}</span>
        </div>
        <details class="raw"><summary class="muted">evidence</summary><pre>${esc(JSON.stringify(s.evidence, null, 2))}</pre></details>
      </div>`).join("") || `<p class="muted">No signals in scope.</p>`);
  } catch (e) {
    panel.innerHTML = `<p style="color:var(--critical)">${esc(e.message)}</p>`;
  }
}

async function loadAudit() {
  const panel = $("#tab-audit");
  try {
    const out = await api(`/api/audit?user_id=${encodeURIComponent(state.user)}`);
    panel.innerHTML = `<p class="muted">Every tool call, denial, proposal and execution — ${out.full_access ? "all users" : "your activity only"}.</p>
      <table class="audit"><tr><th>#</th><th>actor</th><th>event</th><th>tool</th><th>outcome</th></tr>
      ${out.entries.map((e) => `<tr>
        <td>${e.seq}</td><td>${esc(e.actor)}</td><td>${esc(e.event)}</td>
        <td>${esc(e.tool || "-")}</td>
        <td class="${e.outcome.includes("denied") ? "deny" : ""}">${esc(e.outcome)}${e.detail ? ` <span class="muted">(${esc(String(e.detail).slice(0, 60))})</span>` : ""}</td>
      </tr>`).join("")}</table>`;
  } catch (e) {
    panel.innerHTML = `<p style="color:var(--critical)">${esc(e.message)}</p>`;
  }
}

function loadSources() {
  const b = state.boot;
  const user = b.users.find((u) => u.user_id === state.user);
  $("#tab-sources").innerHTML = `
    <h3 style="margin:0 0 8px;font-size:13px">Document corpus (authority order)</h3>
    ${b.documents.slice().sort((x, y) => x.authority_tier - y.authority_tier).map((d) => `
      <div class="signal ${d.status === "DEPRECATED" ? "critical" : "info"}">
        <h4>${esc(d.title)}</h4>
        <p>tier ${d.authority_tier} · ${esc(d.doc_type)} · ${esc(d.status)} · effective ${esc(d.effective_date || "-")} · scope ${esc(d.applies_to)}</p>
        <div class="rec muted">${esc(d.source_file)}</div>
      </div>`).join("")}
    <h3 style="margin:16px 0 8px;font-size:13px">Your access</h3>
    <div class="signal info">
      <h4>${esc(user.name)} — ${esc(user.role_label)}</h4>
      <p>Account scope: ${esc(user.account_scope === "all" ? "all accounts" : user.assigned_accounts.join(", ") || "none")}</p>
      <p>Permissions: ${user.permissions.map((p) => `<span class="pill">${esc(p)}</span>`).join(" ")}</p>
      <p>Credit authority without approval: INR ${esc(user.limits?.max_credit_inr_without_approval ?? 0)}</p>
      ${user.redact_customer_content ? `<p>Customer free-text is redacted for this role.</p>` : ""}
    </div>
    <h3 style="margin:16px 0 8px;font-size:13px">Business-calendar assumption</h3>
    <div class="signal medium"><p>${esc(b.business_calendar.note || "")} ${esc(b.business_calendar.start)}–${esc(b.business_calendar.end)}, Mon–Fri, ${esc(b.business_calendar.timezone)}.</p></div>`;
}

function setUser(userId) {
  state.user = userId;
  const u = state.boot.users.find((x) => x.user_id === userId);
  $("#scopeTag").textContent =
    u.account_scope === "all" ? "scope: all accounts" : `scope: ${u.assigned_accounts.join(", ") || "none"}`;
  $("#chat").innerHTML = "";
  addMsg("sys", `Signed in as <b>${esc(u.name)}</b> (${esc(u.role_label)}). Data access and actions are enforced server-side for this role.`);
  loadSignals();
  loadAudit();
  loadSources();
}

async function boot() {
  state.boot = await api("/api/bootstrap");
  $("#snapshotTag").textContent = `snapshot ${state.boot.snapshot} ${state.boot.timezone}`;
  $("#modelTag").textContent = `groq · ${state.boot.model}`;
  if (!state.boot.llm_configured) {
    $("#warnbar").style.display = "block";
    $("#warnbar").textContent = "GROQ_API_KEY is not set — chat is disabled. Ops signals, audit and the deterministic evaluators still work.";
  }
  $("#userSel").innerHTML = state.boot.users
    .map((u) => `<option value="${u.user_id}">${esc(u.name)} — ${esc(u.role_label)}</option>`).join("");
  $("#examples").innerHTML = EXAMPLES.map((e) => `<button type="button">${esc(e)}</button>`).join("");
  $("#examples").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { $("#input").value = b.textContent; $("#input").focus(); }));
  setUser(state.boot.users[0].user_id);
}

$("#userSel").addEventListener("change", (e) => setUser(e.target.value));
$("#resetBtn").addEventListener("click", () => {
  state.session = "sess-" + Math.random().toString(36).slice(2, 8);
  setUser(state.user);
});
$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = "";
  send(text);
});
document.querySelectorAll(".tabs button").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("active"));
    document.querySelectorAll(".tabpanel").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    $(`#tab-${b.dataset.tab}`).classList.add("active");
    if (b.dataset.tab === "signals") loadSignals();
    if (b.dataset.tab === "audit") loadAudit();
  }));

boot();
</script>
</body>
</html>
