# One-click deploy on Render (free tier is enough).
# 1. Push this repo to GitHub.
# 2. Render -> New -> Blueprint -> pick the repo.
# 3. Paste your GROQ_API_KEY when prompted (it is marked sync:false so it is never committed).
services:
  - type: web
    name: parcelpilot-ops-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PYTHON_VERSION
        value: "3.11.9"
